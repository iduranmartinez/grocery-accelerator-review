const u=(s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.i,hash:'SHA-256'},b,{name:'AES-GCM',length:256},true,['decrypt']);}
async function open(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.v)},key,u(D.c));const raw=await crypto.subtle.exportKey('raw',key);sessionStorage.setItem('rk',btoa(String.fromCharCode(...new Uint8Array(raw))));document.open();document.write(new TextDecoder().decode(pt));document.close();}
window.addEventListener('load',async()=>{const k=sessionStorage.getItem('rk');if(k){document.getElementById('f').style.visibility='hidden';try{await open(await crypto.subtle.importKey('raw',u(k),'AES-GCM',true,['decrypt']));return;}catch(e){sessionStorage.removeItem('rk');document.getElementById('f').style.visibility='visible';}}});
document.getElementById('f').addEventListener('submit',async(ev)=>{ev.preventDefault();const e=document.getElementById('e');e.textContent='…';try{await open(await keyFrom(document.getElementById('p').value));}catch(err){e.textContent='Wrong password · Contraseña incorrecta';}});
